version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    ports:
      - "5432:5432"
    volumes:
      - kairos_pg_data:/var/lib/postgresql/data
      - ../database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: kairos-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5679:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5679/}
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change_me}
    volumes:
      - kairos_n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows

  ollama:
    image: ollama/ollama:latest
    container_name: kairos-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - kairos_ollama_data:/root/.ollama

volumes:
  kairos_pg_data:
  kairos_n8n_data:
  kairos_ollama_data:
